services:
  # ─────────────────────────────────────────
  # SINGLE WEB SERVICE: Control Panel & Bot Runner
  # ─────────────────────────────────────────
  - type: web
    name: demo-panel
    runtime: python
    rootDir: panel
    buildCommand: pip install -r requirements.txt -r ../scraper/requirements.txt -r ../pipeline/requirements.txt -r ../organisepost/requirements.txt -r ../ai-assistant/requirements.txt -r ../alldiskwalapost/requirements.txt
    startCommand: uvicorn dashboard:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # General configuration
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MONGO_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # Bot session strings
      - key: SESSION_STRING_SCRAPER
        sync: false
      - key: SESSION_STRING_PIPELINE
        sync: false
      - key: SESSION_STRING_ORGANIZER
        sync: false
      - key: SESSION_STRING_ALLDISKWALAPOST
        sync: false

      # Scraper Bot configurations
      - key: SOURCE_CHAT_SCRAPER
        sync: false
      - key: TARGET_CHAT_SCRAPER
        sync: false
      - key: CHAT_FOLDER_LINK
        sync: false
      - key: COOLDOWN_SCAN_INTERVAL
        value: "600"

      # Pipeline Bot configurations
      - key: SOURCE_CHAT_PIPELINE
        sync: false
      - key: TARGET_CHAT_PIPELINE
        sync: false
      - key: TARGET_BOT_USERNAME
        value: DiskWalaFileUploaderBot
      - key: COOLDOWN_BETWEEN_POSTS
        value: "15"
      - key: GROQ_API_KEY
        sync: false

      # Organizer Bot configurations
      - key: TARGET_CHAT_ORGANIZER
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # All DiskWala Post Bot configurations
      - key: SOURCE_CHAT_ALLDISKWALAPOST
        sync: false
      - key: TARGET_CHAT_ALLDISKWALAPOST
        sync: false
